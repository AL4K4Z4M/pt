<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Space+Grotesk%3Awght%40400%3B500%3B700" onload="this.rel='stylesheet'" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<title>PlateTraits</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
      :root {
        --primary-color: #1979e6;
        --background-color: #f8fafc;
        --card-background: #ffffff;
        --text-primary: #111827;
        --text-secondary: #6b7280;
        --border-color: #e5e7eb;
      }
      body {
        font-family: 'Space Grotesk', sans-serif;
        background-color: var(--background-color);
        color: var(--text-primary);
      }
    </style>
</head>
<body>
<div class="relative flex size-full min-h-screen flex-col overflow-x-hidden">
<div class="flex h-full grow flex-col">
<header class="sticky top-0 z-10 w-full border-b border-solid bg-[var(--background-color)] px-4 sm:px-10 py-4 shadow-sm">
<div class="mx-auto flex max-w-7xl items-center justify-between">
<div class="flex items-center gap-8">
<a class="flex items-center gap-3 text-2xl font-bold tracking-tight text-[var(--text-primary)]" href="#">
<svg class="h-8 w-8 text-[var(--primary-color)]" fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M6 6H42L36 24L42 42H6L12 24L6 6Z" fill="currentColor"></path>
</svg>
                PlateTraits
              </a>
</div>
<div class="hidden items-center gap-8 md:flex">
<a class="text-sm font-medium text-[var(--text-secondary)] transition-colors hover:text-[var(--text-primary)]" href="#">Home</a>
<a class="text-sm font-medium text-[var(--text-secondary)] transition-colors hover:text-[var(--text-primary)]" href="#">About</a>
<a class="text-sm font-medium text-[var(--text-secondary)] transition-colors hover:text-[var(--text-primary)]" href="#">Contact</a>
</div>
<div class="flex items-center gap-4">
<div class="hidden sm:flex">
<label class="relative">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
<svg class="h-5 w-5 text-[var(--text-secondary)]" fill="currentColor" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
<path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"></path>
</svg>
</div>
<input class="form-input h-10 w-full min-w-40 max-w-md rounded-md border border-[var(--border-color)] bg-[var(--card-background)] py-2 pl-10 pr-4 text-sm text-[var(--text-primary)] placeholder:text-[var(--text-secondary)] focus:border-[var(--primary-color)] focus:outline-none focus:ring-1 focus:ring-[var(--primary-color)]" placeholder="Search by plate..." type="search"/>
</label>
</div>
<div class="flex gap-2">
<button class="flex h-10 min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-md bg-[var(--primary-color)] px-4 text-sm font-bold text-white shadow-sm transition-all hover:bg-opacity-90">
<span class="truncate">Sign Up</span>
</button>
<button class="flex h-10 min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-md border border-[var(--border-color)] bg-[var(--card-background)] px-4 text-sm font-bold text-[var(--text-primary)] shadow-sm transition-all hover:bg-gray-100">
<span class="truncate">Log In</span>
</button>
</div>
</div>
</div>
</header>
<main class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-6 lg:px-8">
<div class="mb-8">
<h1 class="text-4xl font-bold tracking-tighter text-[var(--text-primary)] sm:text-5xl">Recent Reviews</h1>
<p class="mt-2 text-lg text-[var(--text-secondary)]">The latest driving experiences shared by our community.</p>
</div>
<div class="grid grid-cols-1 gap-8 lg:grid-cols-3">
<div class="space-y-8 lg:col-span-2">
</div>
<aside class="space-y-8 lg:col-span-1">
<div class="rounded-lg border border-[var(--border-color)] bg-[var(--card-background)] p-6 shadow-sm">
<h3 class="text-lg font-semibold text-[var(--text-primary)]">Submit a Review</h3>
<p class="mt-1 text-sm text-[var(--text-secondary)]">Spotted a good or bad driver? Share your experience.</p>
<button class="mt-4 w-full flex h-10 items-center justify-center rounded-md bg-[var(--primary-color)] px-4 text-sm font-bold text-white shadow-sm transition-all hover:bg-opacity-90">
                  Add New Review
                </button>
</div>
<div class="rounded-lg border border-[var(--border-color)] bg-[var(--card-background)] p-6 shadow-sm">
<h3 class="text-lg font-semibold text-[var(--text-primary)]">Top Contributors</h3>
<ul class="mt-4 space-y-4">
</ul>
</div>
</aside>
</div>
</main>
</div>
</div>
<script src="js/utils.js" defer></script>
<script src="js/home-beta.js" defer></script>
</body></html>
